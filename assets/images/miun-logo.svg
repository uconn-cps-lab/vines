<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <style>
      .miun-main { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 24px; fill: #003366; letter-spacing: 0.5px; }
      .miun-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #4a5568; letter-spacing: 0.5px; }
    </style>
  </defs>
  <!-- MIUN Swedish Blue/Yellow Ribbon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Blue ribbon -->
    <path d="M10 55 C15 35 30 15 45 25 C55 32 40 50 30 55 C22 59 15 58 10 55 Z" fill="#004b87" />
    <!-- Yellow / Gold ribbon -->
    <path d="M30 65 C45 65 65 50 60 30 C58 20 48 25 45 35 C40 50 25 58 30 65 Z" fill="#fecb00" />
    <path d="M18 42 C24 30 38 28 48 36 C42 45 30 52 22 48 Z" fill="#0077b6" opacity="0.8" />
  </g>
  <!-- Text -->
  <g transform="translate(90, 36)">
    <text class="miun-main" x="0" y="0">Mittuniversitetet</text>
    <text class="miun-sub" x="0" y="24">MID SWEDEN UNIVERSITY</text>
    <text class="miun-sub" x="0" y="42" font-size="11" fill="#718096">STC Research Centre</text>
  </g>
</svg>
