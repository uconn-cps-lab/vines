<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="auto">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="physBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.5px; }
    .box-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13.5px; fill: #1e293b; text-anchor: middle; }
    .box-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 11px; fill: #64748b; text-anchor: middle; }
    .substrate-badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; }
    .arrow-line { stroke: #0284c7; stroke-width: 2.5; stroke-dasharray: 4,4; fill: none; }
  </style>

  <!-- ================= SUBSTRATE 1: APPLICATION SUBSTRATE ================= -->
  <rect x="20" y="20" width="920" height="130" rx="14" fill="url(#appBg)" stroke="#fdba74" stroke-width="2"/>
  <rect x="35" y="32" width="220" height="28" rx="6" fill="#ea580c"/>
  <text x="145" y="51" class="substrate-badge" fill="#ffffff" text-anchor="middle">Application Substrate</text>

  <!-- App Box 1 -->
  <g transform="translate(40, 70)" filter="url(#cardShadow)">
    <rect width="195" height="65" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#ffedd5"/>
    <text x="28" y="36" font-family="system-ui" font-size="14" text-anchor="middle" fill="#ea580c">📊</text>
    <text x="115" y="28" class="box-title">Monitoring &amp; Control</text>
    <text x="115" y="46" class="box-sub">Sub-millisecond Feedback</text>
  </g>

  <!-- App Box 2 -->
  <g transform="translate(265, 70)" filter="url(#cardShadow)">
    <rect width="195" height="65" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#ffedd5"/>
    <text x="28" y="36" font-family="system-ui" font-size="14" text-anchor="middle" fill="#ea580c">🩺</text>
    <text x="115" y="28" class="box-title">Diagnosis &amp; Prognosis</text>
    <text x="115" y="46" class="box-sub">Predictive Health Anomaly</text>
  </g>

  <!-- App Box 3 -->
  <g transform="translate(490, 70)" filter="url(#cardShadow)">
    <rect width="195" height="65" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#ffedd5"/>
    <text x="28" y="36" font-family="system-ui" font-size="14" text-anchor="middle" fill="#ea580c">👁️</text>
    <text x="115" y="28" class="box-title">Machine Vision</text>
    <text x="115" y="46" class="box-sub">Real-Time Visual Defect</text>
  </g>

  <!-- App Box 4 -->
  <g transform="translate(715, 70)" filter="url(#cardShadow)">
    <rect width="210" height="65" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#ffedd5"/>
    <text x="28" y="36" font-family="system-ui" font-size="14" text-anchor="middle" fill="#ea580c">🤖</text>
    <text x="125" y="28" class="box-title">Cobot Path Planning</text>
    <text x="125" y="46" class="box-sub">Collaborative Trajectory</text>
  </g>

  <!-- Connectors App -> Cyber -->
  <path d="M140 150 L140 185" class="arrow-line" stroke="#ea580c" />
  <path d="M360 150 L360 185" class="arrow-line" stroke="#ea580c" />
  <path d="M590 150 L590 185" class="arrow-line" stroke="#ea580c" />
  <path d="M820 150 L820 185" class="arrow-line" stroke="#ea580c" />

  <!-- ================= SUBSTRATE 2: CYBER SUBSTRATE ================= -->
  <rect x="20" y="185" width="920" height="185" rx="14" fill="url(#cyberBg)" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="35" y="197" width="180" height="28" rx="6" fill="#0284c7"/>
  <text x="125" y="216" class="substrate-badge" fill="#ffffff" text-anchor="middle">Cyber Substrate</text>

  <!-- Left: Predictive Wireless Edge with ISAC -->
  <g transform="translate(45, 235)" filter="url(#cardShadow)">
    <rect width="260" height="115" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="130" y="25" class="box-title" fill="#0369a1">Predictive Wireless Edge</text>
    <text x="130" y="44" class="box-sub">• ML Short-Horizon Channel Prediction</text>
    <text x="130" y="62" class="box-sub">• ISAC Environmental Sensing</text>
    <text x="130" y="80" class="box-sub">• Cycle-Aligned RAN Schedulers</text>
    <rect x="15" y="90" width="230" height="18" rx="4" fill="#e0f2fe"/>
    <text x="130" y="103" font-family="system-ui" font-size="10.5" font-weight="700" fill="#0284c7" text-anchor="middle">5G/6G URLLC Radio Coordination</text>
  </g>

  <!-- Center: Cross-Domain Control & Orchestration Layer -->
  <g transform="translate(340, 230)" filter="url(#cardShadow)">
    <rect width="270" height="125" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="135" y="26" class="box-title" fill="#38bdf8">Cross-Domain Control Layer</text>
    <text x="135" y="44" class="box-sub" fill="#cbd5e1">• Joint Edge/Core Resource Partitioning</text>
    <text x="135" y="62" class="box-sub" fill="#cbd5e1">• Contract-Based SLA Verification</text>
    <text x="135" y="80" class="box-sub" fill="#cbd5e1">• Closed-Loop Risk Anticipation</text>
    <rect x="20" y="93" width="230" height="22" rx="4" fill="#0369a1"/>
    <text x="135" y="108" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Verifiable End-to-End Guarantees</text>
  </g>

  <!-- Right: Deterministic TSN Core Network -->
  <g transform="translate(645, 235)" filter="url(#cardShadow)">
    <rect width="270" height="115" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="135" y="25" class="box-title" fill="#0369a1">Deterministic TSN Core</text>
    <text x="135" y="44" class="box-sub">• IEEE 802.1Qbv Time-Aware Shaper</text>
    <text x="135" y="62" class="box-sub">• Shadow Schedule Generation</text>
    <text x="135" y="80" class="box-sub">• Zero-Touch Fault Failover</text>
    <rect x="20" y="90" width="230" height="18" rx="4" fill="#e0f2fe"/>
    <text x="135" y="103" font-family="system-ui" font-size="10.5" font-weight="700" fill="#0284c7" text-anchor="middle">Bounded Latency &amp; Determinism</text>
  </g>

  <!-- Inter-Cyber bi-directional arrows -->
  <path d="M305 290 L340 290" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M610 290 L645 290" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Connectors Cyber -> Physical -->
  <path d="M175 370 L175 405" class="arrow-line" stroke="#059669" />
  <path d="M475 370 L475 405" class="arrow-line" stroke="#059669" />
  <path d="M780 370 L780 405" class="arrow-line" stroke="#059669" />

  <!-- ================= SUBSTRATE 3: PHYSICAL SUBSTRATE ================= -->
  <rect x="20" y="405" width="920" height="135" rx="14" fill="url(#physBg)" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="35" y="417" width="190" height="28" rx="6" fill="#059669"/>
  <text x="130" y="436" class="substrate-badge" fill="#ffffff" text-anchor="middle">Physical Substrate</text>

  <!-- Physical Box 1: Collaborative Robots -->
  <g transform="translate(45, 455)" filter="url(#cardShadow)">
    <rect width="265" height="70" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="32" cy="35" r="16" fill="#d1fae5"/>
    <text x="32" y="40" font-family="system-ui" font-size="16" text-anchor="middle" fill="#059669">🦾</text>
    <text x="150" y="28" class="box-title">Cobots &amp; Mobile AMRs</text>
    <text x="150" y="46" class="box-sub">Multi-axis Coordinated Tasks</text>
    <text x="150" y="60" class="box-sub">Microsecond Motion Sync</text>
  </g>

  <!-- Physical Box 2: Dynamic Shop Floor Environment -->
  <g transform="translate(340, 455)" filter="url(#cardShadow)">
    <rect width="270" height="70" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="32" cy="35" r="16" fill="#d1fae5"/>
    <text x="32" y="40" font-family="system-ui" font-size="16" text-anchor="middle" fill="#059669">🏭</text>
    <text x="155" y="28" class="box-title">Human-Machine-Sensor Space</text>
    <text x="155" y="46" class="box-sub">Dynamic Obstacles &amp; Movement</text>
    <text x="155" y="60" class="box-sub">Multi-path RF Shadowing</text>
  </g>

  <!-- Physical Box 3: Smart Tools & Actuators -->
  <g transform="translate(645, 455)" filter="url(#cardShadow)">
    <rect width="270" height="70" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="32" cy="35" r="16" fill="#d1fae5"/>
    <text x="32" y="40" font-family="system-ui" font-size="16" text-anchor="middle" fill="#059669">⚡</text>
    <text x="155" y="28" class="box-title">Sensors &amp; High-Mix Cells</text>
    <text x="155" y="46" class="box-sub">Industrial IIoT Telemetry</text>
    <text x="155" y="60" class="box-sub">Ultra-Reliable Real-Time I/O</text>
  </g>
</svg>
