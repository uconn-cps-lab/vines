    <circle cx="80" cy="80" r="66" fill="#c59b27" stroke="#997010" stroke-width="1.5"/>
  </g>
  <!-- Inner Globe Circle -->
  <circle cx="80" cy="80" r="54" fill="url(#nsfGlow)" stroke="#f7d05c" stroke-width="2"/>
