    <ellipse cx="80" cy="80" rx="28" ry="52" />
    <line x1="80" y1="26" x2="80" y2="134" />
    <line x1="26" y1="80" x2="134" y2="80" />
  </g>
  <!-- Stylized gold land masses -->
  <path d="M50 56 Q62 50 72 58 Q85 52 95 62 Q105 70 100 80 Q92 84 82 78 Q74 86 64 82 Q52 80 50 68 Z" fill="#e5c158" opacity="0.45" />
  <path d="M85 90 Q95 86 105 92 Q108 102 98 112 Q88 110 82 102 Z" fill="#e5c158" opacity="0.45" />
  <!-- NSF Text with Gold Outline and Shadow -->
  <text x="80" y="93" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" text-anchor="middle" fill="#ffffff" stroke="#001838" stroke-width="3" paint-order="stroke fill" letter-spacing="2">NSF</text>
