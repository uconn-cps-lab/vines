      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="70%" stop-color="#0a3d82" />
      <stop offset="100%" stop-color="#041e42" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
